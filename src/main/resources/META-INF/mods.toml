# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"
# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="${mod_id}" #mandatory
# The version number of the mod
version="${mod_version}" #mandatory
# A display name for the mod
displayName="${mod_name}" #mandatory
# A URL to query for updates for this mod. See the JSON update specification https://docs.minecraftforge.net/en/latest/misc/updatechecker/
#
# Forge's own update checker replaces the home-grown one this mod used to run (RS10-018). That one
# fetched a bare VERSION file from `otectus/runicskills` — a repository that does not exist; the
# real one is `otectus/runic-skills` — and then treated ANY difference from the running version as
# an update, so it would have told players on a newer development build to downgrade. Forge parses
# real version ranges, knows the difference between newer and older, and reports through the mods
# list instead of a chat line on every login.
updateJSONURL="https://raw.githubusercontent.com/otectus/runic-skills/master/update.json" #optional
# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="runicskills.png" #optional
# A text field displayed in the mod UI
#credits="Thanks for this example mod goes to Java" #optional
# A text field displayed in the mod UI
authors="${mod_authors}" #optional
# Display Test controls the display for your mod in the server connection screen
# MATCH_VERSION means that your mod will cause a red X if the versions on client and server differ. This is the default behaviour and should be what you choose if you have server and client elements to your mod.
# IGNORE_SERVER_VERSION means that your mod will not cause a red X if it's present on the server but not on the client. This is what you should use if you're a server only mod.
# IGNORE_ALL_VERSION means that your mod will not cause a red X if it's present on the client or the server. This is a special case and should only be used if your mod has no server component.
# NONE means that no display test is set on your mod. You need to do this yourself, see IExtensionPoint.DisplayTest for more information. You can define any scheme you wish with this value.
# IMPORTANT NOTE: this is NOT an instruction as to which environments (CLIENT or DEDICATED SERVER) your mod loads on. Your mod should load (and maybe do nothing!) whereever it finds itself.
#displayTest="MATCH_VERSION" # MATCH_VERSION is the default if nothing is specified (#optional)

# The description text for the mod (multi line!) (#mandatory)
description='''${mod_description}'''
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies."${mod_id}"]] #optional
   # the modid of the dependency
   modId="forge" #mandatory
   # Does this dependency have to exist - if not, ordering below must be specified
   mandatory=true #mandatory
   # The version range of the dependency
   versionRange="${forge_version_range}" #mandatory
   # An ordering relationship for the dependency - BEFORE or AFTER required if the dependency is not mandatory
   # BEFORE - This mod is loaded BEFORE the dependency
   # AFTER - This mod is loaded AFTER the dependency
   ordering="NONE"
   # Side this dependency is applied on - BOTH, CLIENT, or SERVER
   side="BOTH"# Here's another dependency
[[dependencies."${mod_id}"]]
   modId="minecraft"
   mandatory=true
   # This version range declares a minimum of the current minecraft version up to but not including the next major version
   versionRange="${minecraft_version_range}"
   ordering="NONE"
   side="BOTH"
[[dependencies."${mod_id}"]]
    modId = "yet_another_config_lib_v3"
    mandatory = false
    versionRange = "[3.4.2,)"
    ordering = "AFTER"
    side = "CLIENT"
[[dependencies."${mod_id}"]]
    modId = "kubejs"
    mandatory = false
    versionRange = "[2001,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "rhino"
    mandatory = false
    versionRange = "[2001,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "ars_nouveau"
    mandatory = false
    versionRange = "[4.0,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "attributeslib"
    mandatory = false
    versionRange = "[1.3.0,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "apotheosis"
    mandatory = false
    versionRange = "[7.0.0,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "ftbquests"
    mandatory = false
    versionRange = "[2001.4,2002.0)"
    ordering = "AFTER"
    side = "BOTH"
# Optional, but version-gated when present. Until 1.8.0 the integration was gated only by
# ModList.isLoaded("legendarytabs"), which any version satisfies — so a Legendary Tabs 2.0
# install loaded happily against a tab compiled for the 1.x TabBase API and then died with
# an AbstractMethodError on the first frame the strip drew. The range makes that a clean
# refusal at load time instead.
# ── Optional mods this build links against directly ──────────────────────────────────────────
#
# Every entry below is a mod whose CLASSES this jar references — an API call, an event type, or a
# mixin target — as opposed to the several integrations that only match registry namespaces and
# genuinely work against any version. Until 2.0.0 none of these were declared at all, so
# `ModList.isLoaded` was satisfied by any version whatsoever and an API change surfaced as a
# NoSuchMethodError deep in gameplay rather than as a clean refusal at load (RS10-019).
#
# Each range starts at the version this build actually compiles against, taken from that jar's own
# metadata, and is open-ended upward: a lower bound is a fact, an upper bound would be a guess.

# Iron's Spells 'n Spellbooks. The largest API surface here by far — spell events, the attribute
# registry, MagicData, and the whole Powers dispatcher. 3.15.0 is the floor because that is where
# SpellCooldownAddedEvent appeared, which the Phase-1a perks subscribe to.
[[dependencies."${mod_id}"]]
    modId = "irons_spellbooks"
    mandatory = false
    versionRange = "[1.20.1-3.15.0,)"
    ordering = "AFTER"
    side = "BOTH"
# Placebo — Apotheosis's library, used directly for GetEnchantmentLevelEvent and DynamicHolder.
[[dependencies."${mod_id}"]]
    modId = "placebo"
    mandatory = false
    versionRange = "[8.6.3,)"
    ordering = "AFTER"
    side = "BOTH"
# Curios — the accessory slots the lock system reads.
[[dependencies."${mod_id}"]]
    modId = "curios"
    mandatory = false
    versionRange = "[5.9.1,)"
    ordering = "AFTER"
    side = "BOTH"
# Better Combat — MixTargetFinder targets its collision code.
[[dependencies."${mod_id}"]]
    modId = "bettercombat"
    mandatory = false
    versionRange = "[1.8.5,)"
    ordering = "AFTER"
    side = "BOTH"
# L2Tabs — the inventory tab strip. Client-only, like Legendary Tabs.
[[dependencies."${mod_id}"]]
    modId = "l2tabs"
    mandatory = false
    versionRange = "[0.3.3,)"
    ordering = "AFTER"
    side = "CLIENT"
# The gun mods. Each supplies item classes the lock and combat perks inspect; Vic's Point Blank is
# additionally a mixin target.
[[dependencies."${mod_id}"]]
    modId = "pointblank"
    mandatory = false
    versionRange = "[1.5.12,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "tacz"
    mandatory = false
    versionRange = "[1.0.2,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "cgm"
    mandatory = false
    versionRange = "[1.4.17,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "scguns"
    mandatory = false
    versionRange = "[0.1.5,)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "legendarytabs"
    mandatory = false
    versionRange = "[1.20.1-2.0,)"
    ordering = "AFTER"
    side = "CLIENT"