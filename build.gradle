buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // Pinned to an immutable revision of the 0.7-SNAPSHOT stream.
        //
        // A bare SNAPSHOT plus the two dynamic version ranges below meant the same commit could
        // produce a different jar tomorrow than it did today, with no record of what changed —
        // and a broken upstream publish became a broken build for everyone, including CI on old
        // tags (RS-036). Update these deliberately, not implicitly.
        classpath 'org.spongepowered:mixingradle:0.7.38'
        // ASM for `checkMixinRemapping`, which resolves every mixin member reference against the
        // real class hierarchy in the deobf artifacts. ForgeGradle happens to put ASM on this
        // classpath today, but that is an implementation detail of a plugin we do not control, so
        // the check declares what it needs rather than borrowing it.
        classpath 'org.ow2.asm:asm:9.6'
        classpath 'org.ow2.asm:asm-tree:9.6'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

// One build stamp for every archive this project produces. SOURCE_DATE_EPOCH is the
// cross-ecosystem convention for "the timestamp a reproducible build should claim"; release CI
// sets it from the commit date so two clean builds of one commit hash identically (RS10-023).
ext.reproducibleTimestamp = {
    def epoch = System.getenv('SOURCE_DATE_EPOCH')
    def instant = epoch ? java.time.Instant.ofEpochSecond(epoch as long) : java.time.Instant.EPOCH
    java.time.format.DateTimeFormatter
            .ofPattern("yyyy-MM-dd'T'HH:mm:ssZ")
            .withZone(java.time.ZoneOffset.UTC)
            .format(instant)
}()

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Compile-only source set holding a hand-written signature mirror of the Legendary Tabs 2.0
// API (src/legendarytabsApi/java). Runic Skills' tab genuinely subclasses TabBase, so the
// dependency cannot be reflected away — but pulling it from a flat-dir jar meant a fresh
// clone could not build, because that jar is not (and, being a whole third-party mod, should
// not be) tracked here (RS10-001). Compiling our own stub keeps the build self-contained: it
// is on the compile classpath only, so it never enters the shipped jar or any run
// configuration, and the real Legendary Tabs classes are what load at runtime.
//
// The same applies to CustomNPCs (src/customnpcsApi/java): its inventory tab strip is built from
// `noppes.npcs.client.gui.player.tabs.AbstractTab`, and our tab has to subclass it to inherit that
// mod's exact rendering, hover and selected-state drawing. CustomNPCs has no Maven coordinate
// either, so the same stub-source-set treatment applies — compile classpath only, never shipped,
// with a reflective probe at runtime turning any upstream drift into a fallback rather than a crash.
sourceSets {
    legendarytabsApi
    customnpcsApi

    // Forge GameTests (src/gametest/java). Separate from src/main so behavioural test code never
    // ships in the mod jar, and separate from src/test because these need a real Minecraft server
    // — the unit-test classpath is deliberately Forge-free (RS10-003).
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    // Give the stub the Minecraft/Forge classes its signatures reference.
    legendarytabsApiCompileOnly.extendsFrom(minecraft)
    customnpcsApiCompileOnly.extendsFrom(minecraft)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // GameTests are part of the mod only inside a run configuration; the jar task
                    // packages sourceSets.main.output alone, so they never reach a release.
                    source sourceSets.gametest
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Cloth Config API
    maven {
        url = "https://maven.shedaniel.me/"
    }
    // Player Animation
    maven {
        name = "KosmX's maven"
        url = 'https://maven.kosmx.dev/'
    }
    // BetterCombat
    maven {
        url = 'https://api.modrinth.com/maven'
    }

    // Curios API
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    // YetAnotherConfigLib
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }

    // Tetra, PointBlank, Tac:Zero, MrCrayfish's Gun Mod, ScorchedGuns 2 & JEI
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // KubeJS
    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
        }
    }

    // Botania (Vazkii's Blame-Jared maven — ships the :api classifier we compile against)
    maven {
        url = "https://maven.blamejared.com"
    }

    // MineColonies family (Heritage Builder integration). LDTTeam's Artifactory is anonymous;
    // scoped to their group so nothing else is ever resolved from it.
    maven {
        url = "https://ldtteam.jfrog.io/artifactory/modding/"
        content {
            includeGroup "com.ldtteam"
        }
    }

    // Tinker's Construct + Mantle (SlimeKnights' own maven). Scoped to their two groups so
    // nothing else is ever resolved from it. Mantle is a hard runtime requirement of Tinkers'
    // and is not declared in the TConstruct pom, so both coordinates are named explicitly.
    maven {
        url = "https://dvs1.progwml6.com/files/maven/"
        content {
            includeGroup "slimeknights.tconstruct"
            includeGroup "slimeknights.mantle"
        }
    }

    // L2 Tabs
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:' + minecraft_version + '-' + forge_version

    // Mixin Extras
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.0")) {
        jarJar.ranged(it, "[0.4.0,)")
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // KubeJS (via Modrinth Maven - saps.dev no longer hosts these)
    implementation fg.deobf("maven.modrinth:kubejs:${kubejs_version}+forge")
    implementation fg.deobf("maven.modrinth:rhino:${rhino_version}+forge")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // L2 (L2Library via Modrinth Maven, L2Tabs from local libs/)
    compileOnly fg.deobf("maven.modrinth:l2library:2.4.28")
    compileOnly fg.deobf("dev.xkmc.l2tabs:l2tabs:0.3.3")

    // Legendary Tabs (Sfiomn) — compiled against the in-repo API stub declared above, not a
    // local jar, so a fresh clone builds. 2.0 is a breaking API change from 1.x: TabBase gained
    // abstract getId()/getIconTexture() and render() took three more parameters. The stub
    // mirrors 2.0; keep it and the legendarytabs versionRange in mods.toml in step.
    compileOnly sourceSets.legendarytabsApi.output

    // CustomNPCs (Noppes / GBPort Unofficial) — compiled against the in-repo API stub declared
    // above for the same reason as Legendary Tabs: no Maven coordinate, and our tab subclasses
    // theirs, so the dependency cannot be reflected away at compile time. Runtime linkage is
    // guarded by the probe in CustomNpcsIntegration.
    compileOnly sourceSets.customnpcsApi.output

    // ClothConfig implementation (Required by BetterCombat)
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.118")

    // PlayerAnimator implementation (Required by BetterCombat)
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")

    // BetterCombat implementation
    implementation fg.deobf('maven.modrinth:better-combat:1.8.5+1.20.1-forge')

    runtimeOnly(implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1"))
    compileOnly(fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1:api"))

    // YetAnotherConfigLib implementation
    runtimeOnly(implementation fg.deobf("dev.isxander:yet-another-config-lib:${yacl_version}"))
    compileOnly(fg.deobf("dev.isxander:yet-another-config-lib:${yacl_version}"))

    // Tetra compatibility — removed

    // PointBlank compatibility
    compileOnly fg.deobf("curse.maven:vics-point-blank-961053:5541544")

    // Timeless and classics: zero compatibility
    compileOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:5529117")

    // MrCrayfish's Gun Mod compatibility
    compileOnly fg.deobf("curse.maven:mrcrayfishs-gun-mod-unofficial-945471:5212457")
    runtimeOnly fg.deobf("curse.maven:framework-549225:5388226")

    // Scorched Guns 2 compatibility
    compileOnly fg.deobf("curse.maven:scorched-guns-802940:5630448")

    // Apotheosis / Apothic Attributes compatibility
    compileOnly fg.deobf("curse.maven:placebo-283644:6274231")
    compileOnly fg.deobf("curse.maven:apothic-attributes-898963:5634071")
    compileOnly fg.deobf("curse.maven:apotheosis-313970:6461960")

    // Iron's Spells 'n Spellbooks compatibility. Bumped from 5539243 (pre-3.15)
    // to 7402504 (3.15.x) so Phase-1a perks can subscribe to SpellCooldownAddedEvent.
    compileOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:7402504")

    // Tinker's Construct compatibility. Compile-only, and always against the STABLE pin: shared
    // code has to build against the lowest supported API, so a 3.12-only signature cannot be
    // reached by accident. Runtime jars come from the -PtinkersProfile switch below, never here,
    // which is what keeps the default dev client and gameTestServer Tinkers-free.
    compileOnly fg.deobf("slimeknights.mantle:Mantle:${mantle_stable_version}")
    compileOnly fg.deobf("slimeknights.tconstruct:TConstruct:${tconstruct_stable_version}")

    // Tinkers' add-ons (S5). Compile-only, one coordinate per add-on whose API an adapter under
    // integration/tconstruct/addons/ actually names; runtime jars come from -PtinkersAddons below.
    // Modrinth's maven is already declared (BetterCombat/JEI use it), so no new repository.
    //
    // Only the five add-ons that gate a spec section 10.3 perk are on the compile classpath.
    // Tinkers' Things, Tinkers' Innovation, Tinkers' Advanced-Materials and L2 Complements gate no
    // perk (they are section 12.4/12.8 coverage targets), so they are runtime-profile entries only
    // and no Runic class names them. L2 Complements in particular would force l2library 2.5.3 onto
    // a compile classpath already pinned to 2.4.28 above.
    //
    // Tinkers' Advanced is GPL-3.0 and its required library EtSTLib travels with it: same treatment
    // as MineColonies above — we link against the published jars, ship none of their bytecode, and
    // the only classes naming them are reached through the reflective add-on probe.
    compileOnly fg.deobf("maven.modrinth:tcintegrations:1.20.1-2.0.25.19")
    compileOnly fg.deobf("maven.modrinth:tinkers-levelling-addon:1.4.3")
    compileOnly fg.deobf("maven.modrinth:tinkers-delight:2.0.3")
    compileOnly fg.deobf("maven.modrinth:farmers-delight:1.20.1-1.3.4")
    // EtSTLib and not Tinkers' Advanced itself: the audited FE seam Charged Craft uses
    // (ToolEnergyUtil.extractEnergy) lives in the library, and the add-on's own classes are named
    // by nothing in this mod, so putting them on the compile classpath would only claim a
    // dependency we do not have.
    compileOnly fg.deobf("maven.modrinth:etstlib:3.0.0-beta.20")

    // Ars Nouveau compatibility
    compileOnly fg.deobf("curse.maven:ars-nouveau-401955:6688854")
    runtimeOnly fg.deobf("curse.maven:caelus-308989:5281700")


    // Gecko Lib compatibility
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:5460309")

    // FTB Quests Forge compatibility (since 1.3.0). Compile-only CurseForge artifacts;
    // resolved at runtime only when the mod is present in the modlist. Architectury
    // is a transitive runtime requirement of FTB Quests but is not declared here —
    // pack authors who ship FTB Quests are responsible for shipping Architectury
    // alongside it. The CurseForge Maven repo (cursemaven) is already declared above.
    // ftb-quests-forge project 289412 file 8078538 = 2001.4.22 (1.20.1 latest)
    // ftb-library-forge project 404465 file 7296748 = 2001.2.12 (1.20.1 latest)
    compileOnly fg.deobf("curse.maven:ftb-quests-forge-289412:8078538")
    compileOnly fg.deobf("curse.maven:ftb-library-forge-404465:7296748")

    // MineColonies compatibility (Heritage Builder). Compile-only: resolved at runtime only when
    // the mod is present. There is no -api jar — IBuilding links Structurize and IColonyManager
    // reaches BlockUI types, so the whole family has to be on the compile classpath.
    // MineColonies is GPL-3.0; we link against the published jar and ship none of its bytecode.
    // CurseMaven fallback ids if LDTTeam's Artifactory is unreachable:
    //   minecolonies-245506:8615315, structurize-298744:8610456, blockui-522992:7041657
    compileOnly fg.deobf("com.ldtteam:minecolonies:1.20.1-1.1.1276")
    compileOnly fg.deobf("com.ldtteam:structurize:1.20.1-1.0.818")
    compileOnly fg.deobf("com.ldtteam:blockui:1.20.1-1.0.194")
    compileOnly fg.deobf("com.ldtteam:domum_ornamentum:1.20.1-1.0.288-snapshot:universal")

    // MCA: Reputation — OPTIONAL integration, compile-only. The sibling mod is not published to a
    // Maven, so we compile against its dev-mapped class output. Never bundled and never a runtime
    // dependency: the real mod supplies these classes, and the only class naming them
    // (McaReputationIntegration) is loaded reflectively through RunicSkills.tryLoadIntegration.
    //
    // Build MCA: Reputation first (`../MCAReputation: ./gradlew classes`). When it is absent this
    // warns rather than failing, so a fresh clone still builds — the integration class is what
    // stops compiling, not the mod.
    def mcaReputationClasses = file("${projectDir}/../MCAReputation/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else {
        logger.warn("MCA: Reputation classes not found at ${mcaReputationClasses}; build it first " +
                "(../MCAReputation: ./gradlew classes) or the optional Reputation integration will not compile.")
    }

    // Tinker's Construct runtime profile, selected by a Gradle property:
    //
    //   ./gradlew runGameTestServer                        -> M0: no Tinkers' on the classpath
    //   ./gradlew runGameTestServer -PtinkersProfile=stable -> M1: Tinkers' 3.11 + its Mantle/JEI
    //   ./gradlew runGameTestServer -PtinkersProfile=beta   -> M2: Tinkers' 3.12 + its Mantle/JEI
    //
    // Absent the property nothing is added, so the base gametests and the dev client keep proving
    // that the mod runs with Tinkers' absent — the case that a second, always-on run config would
    // quietly stop testing. Only the runtime classpath changes; compilation is pinned to stable
    // above in every profile. JEI travels with the profile because Tinkers' ships JEI plugins,
    // and Modrinth is the only 1.20.1 JEI maven still serving these builds.
    def tinkersProfile = project.findProperty('tinkersProfile')
    if (tinkersProfile != null) {
        def profiles = [
                stable: [tconstruct_stable_version, mantle_stable_version, jei_stable_version],
                beta  : [tconstruct_beta_version, mantle_beta_version, jei_beta_version],
        ]
        def pins = profiles[tinkersProfile.toString()]
        if (pins == null) {
            throw new GradleException("Unknown -PtinkersProfile='${tinkersProfile}'; expected one of ${profiles.keySet()}")
        }
        logger.lifecycle("Tinkers' runtime profile '${tinkersProfile}': TConstruct ${pins[0]}, Mantle ${pins[1]}, JEI ${pins[2]}")
        runtimeOnly fg.deobf("slimeknights.mantle:Mantle:${pins[1]}")
        runtimeOnly fg.deobf("slimeknights.tconstruct:TConstruct:${pins[0]}")
        runtimeOnly fg.deobf("maven.modrinth:jei:${pins[2]}")
    }

    // Tinkers' add-on runtime profiles (M4-M8), selected by a second Gradle property:
    //
    //   ./gradlew runGameTestServer -PtinkersProfile=stable -PtinkersAddons=levelling,delight
    //
    // Comma-separated slugs, each adding its add-on and that add-on's own required dependencies to
    // the runtime classpath only. -PtinkersProfile alone is unchanged and still boots M1 with no
    // add-on at all, which is what keeps the negative tests (perk dormant, adapter reports why)
    // honest. An add-on whose own hard dependency has no published 1.20.1 artifact has no slug:
    // Tinkers' Things needs Json Things, which is not on any maven this build can reach, so it
    // cannot be booted here and its section 12.4 coverage is descoped rather than faked.
    def tinkersAddons = project.findProperty('tinkersAddons')
    if (tinkersAddons != null) {
        if (tinkersProfile == null) {
            throw new GradleException("-PtinkersAddons needs -PtinkersProfile as well; an add-on " +
                    "without Tinkers' Construct cannot load")
        }
        def catalogue = [
                // Section 12.2 first-class adapter. Its own Botania/Ars/Create/Malum links are
                // optional dependencies, so it boots against Tinkers' alone.
                tcintegrations: ["maven.modrinth:tcintegrations:1.20.1-2.0.25.19"],
                // Section 12.3 tool levelling.
                levelling     : ["maven.modrinth:tinkers-levelling-addon:1.4.3"],
                // Section 12.6 culinary. Farmer's Delight is a mandatory dependency of it.
                delight       : ["maven.modrinth:farmers-delight:1.20.1-1.3.4",
                                 "maven.modrinth:tinkers-delight:2.0.3"],
                // Section 12.7 energy family: Core, from the split family, and not the legacy
                // monolith — which is also the only one that boots. Tinkers' Advanced
                // 3.0.0-beta.13 declares its client TiAcForgeEventHandler as an unqualified
                // @Mod.EventBusSubscriber, so a dedicated server auto-subscribes a class touching
                // net.minecraft.client.player.Input and mod loading fails before Runic is reached.
                // Core 3.0.0-beta.5 publishes the same mod id with Dist.CLIENT declared, and boots.
                advanced      : ["maven.modrinth:etstlib:3.0.0-beta.20",
                                 "maven.modrinth:tinkers-advanced-core:3.0.0-beta.5"],
                // Section 12.8 overlap target. No perk depends on it.
                innovation    : ["maven.modrinth:tinkersinnovation:1.20.1-3.0.0"],
                // Tinkers' Thinking (2.1.0). Modrinth publishes exactly the build the reference
                // pack runs, so this profile exercises the real jar rather than an approximation.
                // Its only optional dependency, Tinkers' Ingenuity, still has no 1.20.1 artifact
                // and is not needed: the two triggers the perks read are Thinking's own.
                thinking      : ["maven.modrinth:tinkers-thinking:0.1.6.6.3"],
                // The two TCIntegrations COMPANIONS, not add-ons: they add nothing to Tinkers' by
                // themselves. Combine them with the tcintegrations slug, which is what finally
                // makes ADDON_BOTANIA_REPAIR_CHARGE and ADDON_ARS_ARMOR_REPAIR reachable in a
                // gametest run instead of dormancy-only:
                //
                //   -PtinkersProfile=stable -PtinkersAddons=tcintegrations,botania,ars
                //
                // Both versions are the ones the reference pack ships, and each brings its own
                // hard dependencies because a runtime classpath is not resolved transitively for
                // mod loading.
                botania       : ["maven.modrinth:patchouli:1.20.1-85-forge",
                                 "maven.modrinth:botania:1.20.1-455-forge"],
                ars           : ["maven.modrinth:curios:5.14.1+1.20.1",
                                 "maven.modrinth:patchouli:1.20.1-85-forge",
                                 // GeckoLib by Modrinth VERSION ID, not by version number, and
                                 // that is not a style choice. 4.8.4 is published for Fabric,
                                 // Forge and NeoForge alike, and Modrinth's maven resolves a bare
                                 // version number to whichever it finds first -- which here is
                                 // geckolib-fabric-1.21.4-4.8.4.jar. The id below is the Forge
                                 // 1.20.1 build, the one the reference pack ships.
                                 "maven.modrinth:geckolib:aC5KMoNg",
                                 "maven.modrinth:ars-nouveau:4.12.7"],
                // Tinkers' Jewelry has no slug, and that is a deliberate refusal rather than an
                // omission. Modrinth's newest 1.20.1 Forge build is 1.1.0; the pack this release
                // was read against runs 1.2.0, which is published on CurseForge only. Booting a
                // gametest against 1.1.0 would produce a green run about a build nobody is
                // running, which is worse than no run at all. The jewelry perks are covered by the
                // dormancy batch, which is honest about what it proves.
                // L2 Complements has no slug: it requires l2library 2.5.0+, and this build already
                // pins l2library 2.4.28 on the compile classpath for the existing L2 integration.
                // Putting 2.5.3 on the runtime classpath makes ForgeGradle re-resolve the compile
                // one and fail to find the 2.4.28 deobf artifact, so the section 12.8 L2 overlap
                // coverage is descoped rather than bought by moving an unrelated pin.
        ]
        tinkersAddons.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }.each { slug ->
            def coordinates = catalogue[slug]
            if (coordinates == null) {
                throw new GradleException("Unknown -PtinkersAddons entry '${slug}'; expected one of ${catalogue.keySet()}")
            }
            logger.lifecycle("Tinkers' add-on '${slug}': ${coordinates.join(', ')}")
            coordinates.each { runtimeOnly fg.deobf(it) }
        }
    }

    // QuiltMC Parsers
    implementation("org.quiltmc.parsers:json:0.2.1")
    implementation("org.quiltmc.parsers:gson:0.2.1")

    // Unit tests (audit 1.3.7). Plain JUnit 5 against pure-logic classes that do not require a
    // running Minecraft. gson + slf4j-api are declared explicitly so the test classpath is
    // self-contained and does not depend on ForgeGradle putting the patched MC jar on it.
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

// Run JUnit 5 tests with `./gradlew test`. ForgeGradle leaves the default test source set in
// place; these tests deliberately avoid Minecraft/Forge types so they run without game bootstrap.
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // The plain jar is the SLIM artifact: it carries this mod's classes and nothing else.
    // MixinExtras is a hard runtime requirement (@ModifyReturnValue in MixItemStack,
    // MixGrindstoneMenu and MixExperienceOrb, plus the four Tinkers' mixins) and Forge does NOT
    // ship it — Forge 1.20.1 47.x does not, verified against the 47.4.22 runtime in a real pack
    // (its launcher libraries and its own forge/fmlcore jars). A player downloading the
    // obvious filename was therefore getting a mod whose injectors had no implementation, working
    // only on packs where some unrelated mod happened to bundle MixinExtras (RS10-042). So the
    // jarJar bundle below takes the unclassified name and the un-bundled one is marked as slim.
    archiveClassifier = 'slim'

    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                // Reproducibility: the same commit must produce the same jar bytes, so this
                // is the SOURCE_DATE_EPOCH the release container supplies rather than "now"
                // (RS10-023). Absent that variable it falls back to the Unix epoch, which is
                // still deterministic; it is only ever a build stamp, never a runtime input.
                "Implementation-Timestamp": project.ext.reproducibleTimestamp
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// The distributable. jarJar packages the reobfuscated `jar` output plus META-INF/jarjar/, and
// reobfJarJar reobfuscates it in its own right, so it is a superset of the slim jar and not a
// second build of it. Taking the unclassified archive name is what makes the file named in the
// README the one that actually contains MixinExtras.
tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
}

// Same goal as the manifest timestamp: identical inputs, identical archive bytes. Applied to
// EVERY archive rather than to `jar` alone — jarJar produces the shipped bundle, and normalising only
// the plain jar left the artifact a release actually ships carrying wall-clock entry timestamps,
// so the reproducible-build job would have compared one normalised jar against one that could
// never match (RS10-023).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Sided-import enforcement: forbids `import net.minecraft.client.*` and other client-only
// packages outside of the directories explicitly designated as client-only. The Forge unified
// jar puts client classes on the classpath of every source set, so this lint task is the only
// way to make sided separation a build-time invariant.
tasks.register('checkSidedImports') {
    group = 'verification'
    description = 'Fails the build if non-client code imports net.minecraft.client.* or similar'

    // Directories whose contents are allowed to import client classes.
    def clientAllowlist = [
            'src/main/java/com/otectus/runicskills/client',
            'src/main/java/com/otectus/runicskills/mixin/client',
            // Clientbound packet handlers — invoked exclusively on the client via
            // DistExecutor / NetworkEvent.Context. Sided cleanup of these is tracked
            // under Track 2 of the review remediation.
            'src/main/java/com/otectus/runicskills/network/packet/client',
            // Client-facing API surface (the inventory tab layout event). Named `client` for the
            // same reason as the packet package: nothing here is ever loaded on a dedicated
            // server, it exists so client-side compat code can talk to us without a hard dep.
            'src/main/java/com/otectus/runicskills/api/client',
    ].collect { file(it).canonicalPath }
    // Top-level files that are explicitly client-side entrypoints.
    def clientFiles = [
            file('src/main/java/com/otectus/runicskills/RunicSkillsClient.java').canonicalPath,
    ]

    // Mixins declared in the `client` array of runicskills.mixins.json are only loaded
    // by Mixin on the client distribution, even though they currently live in the flat
    // mixin/ package alongside common mixins. Pull the list from the manifest so the
    // allowlist stays in sync with reality.
    def mixinJson = file('src/main/resources/runicskills.mixins.json')
    def mixinPkgDir = file('src/main/java/com/otectus/runicskills/mixin')
    if (mixinJson.exists()) {
        def parsed = new groovy.json.JsonSlurper().parseText(mixinJson.text)
        (parsed.client ?: []).each { name ->
            // Strip any sub-package prefix; mixin entries are just simple class names here.
            def simple = (name as String).tokenize('.').last()
            clientFiles << new File(mixinPkgDir, "${simple}.java").canonicalPath
        }
    }

    def forbidden = [
            ~/^\s*import\s+net\.minecraft\.client\..*/,
            ~/^\s*import\s+com\.mojang\.blaze3d\..*/,
    ]

    // YACL is client-side only (mods.toml dependency `side = "CLIENT"`). Keeping any
    // executable YACL class out of common-loaded code is what keeps dedicated servers
    // bootable when YACL is absent. The handler POJOs use field-level YACL annotations
    // (e.g. @SerialEntry, @AutoGen, @IntField) which are RUNTIME-retained but never
    // dereferenced on the server — those imports are allowlisted so the lint doesn't
    // false-fire on them. The forbid pattern targets the class-level YACL APIs that
    // were the source of the 1.0.x dedicated-server crash.
    def yaclForbidden = [
            ~/^\s*import\s+dev\.isxander\.yacl3\.config\.v2\.api\.ConfigClassHandler.*/,
            ~/^\s*import\s+dev\.isxander\.yacl3\.config\.v2\.api\.serializer\..*/,
            ~/^\s*import\s+dev\.isxander\.yacl3\.gui\..*/,
            ~/^\s*import\s+dev\.isxander\.yacl3\.api\..*/,
    ]
    def yaclAllowlist = [
            'src/main/java/com/otectus/runicskills/client/config',
            // YACL plugin classes (controller builders, list-group factories) reachable
            // only via YACL reflection from @ListGroup-annotated fields. Never invoked
            // from common-loaded code, so they don't cause the dedicated-server crash —
            // their .class files just sit in the jar until YACL asks for them.
            'src/main/java/com/otectus/runicskills/config/controller',
            'src/main/java/com/otectus/runicskills/config/StringListGroup.java',
            'src/main/java/com/otectus/runicskills/config/LockItemListGroup.java',
    ].collect { file(it).canonicalPath }

    // Tinker's Construct is an optional mod, so every one of its classes is absent from a stock
    // (M0) install. A `slimeknights.` import anywhere the JVM can reach without Tinkers' present
    // is a NoClassDefFoundError waiting for the first player who does not run it — the same
    // failure mode YACL had on dedicated servers. Confine those imports to the packages that are
    // reached only through the reflective integration probe and the gated mixins.
    def tconstructForbidden = [
            ~/^\s*import\s+slimeknights\..*/,
    ]
    def tconstructAllowlist = [
            'src/main/java/com/otectus/runicskills/integration/tconstruct',
            'src/main/java/com/otectus/runicskills/mixin/tconstruct',
            'src/main/java/com/otectus/runicskills/client/integration/tconstruct',
    ].collect { file(it).canonicalPath }

    // The Tinkers' add-ons (S5) are optional on top of an optional mod, so their classes are absent
    // from strictly more installs than Tinkers' own. Each add-on root package is confined to the
    // adapter and mixin packages reached only through the add-on probe, which is deliberately
    // narrower than the Tinkers' allowlist above: integration/tconstruct/ at large must stay
    // loadable with every add-on absent, and one add-on's adapter has no business naming another's
    // types. com.c2h6s covers EtSTLib and Tinkers' Advanced, which ship as one family.
    def addonForbidden = [
            ~/^\s*import\s+tcintegrations\..*/,
            ~/^\s*import\s+pyre\.tinkerslevellingaddon\..*/,
            ~/^\s*import\s+com\.cxxxxxlt\.tinkers_delight\..*/,
            ~/^\s*import\s+vectorwing\.farmersdelight\..*/,
            ~/^\s*import\s+com\.c2h6s\..*/,
    ]
    def addonAllowlist = [
            'src/main/java/com/otectus/runicskills/integration/tconstruct/addons',
            'src/main/java/com/otectus/runicskills/mixin/tconstruct/addons',
    ].collect { file(it).canonicalPath }
    def gametestAddonAllowlist = [
            'src/gametest/java/com/otectus/runicskills/gametest/tconstruct/addons',
    ].collect { file(it).canonicalPath }
    // Gametests get the same treatment: Tinkers'-dependent tests live under gametest/tconstruct/
    // and are registered conditionally (TConstructGameTests), so nothing else there may name the
    // mod — an import elsewhere would load the class in the M0 run and fail the whole batch.
    def gametestRoot = file('src/gametest/java/com/otectus/runicskills/gametest')
    def gametestTconstructAllowlist = [
            'src/gametest/java/com/otectus/runicskills/gametest/tconstruct',
    ].collect { file(it).canonicalPath }

    // Configuration-time inputs so the task is up-to-date aware.
    def javaRoot = file('src/main/java/com/otectus/runicskills')
    inputs.dir javaRoot
    inputs.dir gametestRoot
    inputs.file mixinJson

    doLast {
        def violations = []
        def yaclViolations = []
        def tconstructViolations = []
        def addonViolations = []
        javaRoot.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith('.java')) return
            def path = f.canonicalPath
            def isClient = clientFiles.contains(path) ||
                    clientAllowlist.any { path == it || path.startsWith(it + File.separator) }
            def isYaclClient = yaclAllowlist.any { path == it || path.startsWith(it + File.separator) }
            def isTconstruct = tconstructAllowlist.any { path == it || path.startsWith(it + File.separator) }
            def isAddon = addonAllowlist.any { path == it || path.startsWith(it + File.separator) }
            f.eachLine { line, n ->
                if (!isClient && forbidden.any { line ==~ it }) {
                    violations << "${f.path}:${n}: ${line.trim()}"
                }
                if (!isYaclClient && yaclForbidden.any { line ==~ it }) {
                    yaclViolations << "${f.path}:${n}: ${line.trim()}"
                }
                if (!isTconstruct && tconstructForbidden.any { line ==~ it }) {
                    tconstructViolations << "${f.path}:${n}: ${line.trim()}"
                }
                if (!isAddon && addonForbidden.any { line ==~ it }) {
                    addonViolations << "${f.path}:${n}: ${line.trim()}"
                }
            }
        }
        gametestRoot.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith('.java')) return
            def path = f.canonicalPath
            def isGametestTconstruct = gametestTconstructAllowlist.any { path == it || path.startsWith(it + File.separator) }
            def isGametestAddon = gametestAddonAllowlist.any { path == it || path.startsWith(it + File.separator) }
            f.eachLine { line, n ->
                if (!isGametestTconstruct && tconstructForbidden.any { line ==~ it }) {
                    tconstructViolations << "${f.path}:${n}: ${line.trim()}"
                }
                if (!isGametestAddon && addonForbidden.any { line ==~ it }) {
                    addonViolations << "${f.path}:${n}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Sided-import violations (move file under client/ or remove the import):\n  " +
                            violations.join('\n  '))
        }
        if (!yaclViolations.isEmpty()) {
            throw new GradleException(
                    "YACL client-only-class imports outside client/config/ (would crash dedicated servers without YACL):\n  " +
                            yaclViolations.join('\n  '))
        }
        if (!tconstructViolations.isEmpty()) {
            throw new GradleException(
                    "Tinker's Construct imports outside integration/tconstruct/, mixin/tconstruct/,\n" +
                            "client/integration/tconstruct/ or gametest/tconstruct/ (they would break\n" +
                            "every install that does not have Tinkers' Construct):\n  " +
                            tconstructViolations.join('\n  '))
        }
        if (!addonViolations.isEmpty()) {
            throw new GradleException(
                    "Tinkers' add-on imports outside integration/tconstruct/addons/,\n" +
                            "mixin/tconstruct/addons/ or gametest/tconstruct/addons/ (they would break\n" +
                            "every install that does not have that add-on):\n  " +
                            addonViolations.join('\n  '))
        }
    }
}
tasks.named('check').configure { dependsOn 'checkSidedImports' }

// Lock-provider enforcement: every integration class that exposes a `generateLockItems()` method
// MUST be wired into LockProviderRegistry, otherwise its documented item-lock compat silently never
// runs (the exact drift that left ISS/Ice&Fire/etc. unwired before 1.3.8). This source-level guard
// fails the build the moment a new lock-capable integration is added without a register(...) line.
tasks.register('checkLockProviders') {
    group = 'verification'
    description = 'Fails the build if an integration with generateLockItems() is not wired into LockProviderRegistry'

    def integrationDir = file('src/main/java/com/otectus/runicskills/integration')
    def registryFile = file('src/main/java/com/otectus/runicskills/integration/lock/LockProviderRegistry.java')

    // Integration classes intentionally NOT registered (with a documented reason). Empty by design;
    // add an entry here only with a justifying comment if a class has generateLockItems() but must
    // stay out of the runtime registry.
    def allowUnregistered = [] as Set

    inputs.dir integrationDir
    inputs.file registryFile

    doLast {
        if (!registryFile.exists()) {
            throw new GradleException("LockProviderRegistry.java not found at ${registryFile.path}")
        }
        def registryText = registryFile.text
        def lockMethod = ~/List<LockItem>\s+generateLockItems\s*\(/
        def missing = []
        integrationDir.eachFile { f ->
            if (!f.isFile() || !f.name.endsWith('.java')) return
            def className = f.name - '.java'
            if (allowUnregistered.contains(className)) return
            if (lockMethod.matcher(f.text).find()) {
                // The registry must reference the class by name (e.g. `SpartanIntegration::generateLockItems`).
                if (!registryText.contains(className)) {
                    missing << className
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Integration class(es) expose generateLockItems() but are not registered in LockProviderRegistry " +
                            "(documented lock compat would silently never run):\n  " + missing.sort().join('\n  ') +
                            "\nAdd a register(adapter(...)) line in LockProviderRegistry.registerDefaults(), " +
                            "or add the class to allowUnregistered in build.gradle with a justifying comment.")
        }
    }
}
tasks.named('check').configure { dependsOn 'checkLockProviders' }

// Version-consistency enforcement: the runtime update checker compares the mod's own version
// against the published VERSION file, so a stale VERSION at release shows every user a false
// "new version available" banner. This drift has now happened twice (1.3.7 audit finding #13,
// again at 1.5.3), so make it a build-time invariant: VERSION, gradle.properties mod_version,
// and the top CHANGELOG entry must agree.
tasks.register('checkVersionConsistency') {
    group = 'verification'
    description = 'Fails the build if VERSION, mod_version, the top CHANGELOG entry or the pinned YACL version disagree'

    def versionFile = file('VERSION')
    def changelogFile = file('CHANGELOG.md')
    def yaclBridge = file('src/main/java/com/otectus/runicskills/client/config/YaclConfigUiBuilder.java')
    def updateManifest = file('update.json')
    // The documents. 2.0.0 reached release candidate with the network protocol printed as 7 in one
    // README section and 5 in another, where the code said 10, a download link naming a jar three
    // minor versions old, and CLAUDE.md declaring the mod to be 1.7.0. Nothing checked any of it,
    // which is the whole reason it drifted for three releases (RS-187 / RS10-024).
    def readmeFile = file('README.md')
    def storePageFile = file('CURSEFORGE_DESCRIPTION.md')
    def agentGuideFile = file('CLAUDE.md')
    def networkingSource = file('src/main/java/com/otectus/runicskills/network/ServerNetworking.java')

    inputs.file versionFile
    inputs.file changelogFile
    inputs.file yaclBridge
    inputs.file updateManifest
    inputs.file readmeFile
    inputs.file storePageFile
    inputs.file agentGuideFile
    inputs.file networkingSource
    inputs.property 'modVersion', project.mod_version
    inputs.property 'yaclVersion', project.yacl_version

    doLast {
        def declared = project.mod_version.toString().trim()
        def published = versionFile.exists() ? versionFile.text.trim() : '<missing VERSION file>'
        def changelogMatcher = changelogFile.text =~ /(?m)^## \[(\d[^\]]*)\]/
        def changelogTop = changelogMatcher.find() ? changelogMatcher.group(1) : '<no ## [x.y.z] entry found>'

        def mismatches = []
        if (published != declared) {
            mismatches << "VERSION file says '${published}' but gradle.properties mod_version is '${declared}'"
        }
        if (changelogTop != declared) {
            mismatches << "CHANGELOG.md top entry is '${changelogTop}' but gradle.properties mod_version is '${declared}'"
        }

        // update.json is what Forge's update checker fetches (RS10-018). It is a hand-maintained
        // file in a repository, served to every user, and nothing at runtime can notice when it
        // falls behind a release — which is precisely how the checker it replaced spent its whole
        // life pointing at a repository that did not exist. So the promos are checked here, where
        // being wrong stops a release instead of misinforming players.
        def promoMatcher = updateManifest.getText('UTF-8') =~ /"1\.20\.1-(latest|recommended)"\s*:\s*"([^"]*)"/
        def promos = [:]
        while (promoMatcher.find()) promos[promoMatcher.group(1)] = promoMatcher.group(2)
        if (promos.isEmpty()) {
            mismatches << "update.json declares no 1.20.1-latest / 1.20.1-recommended promo"
        }
        promos.each { promo, promoted ->
            if (promoted != declared) {
                mismatches << "update.json '1.20.1-${promo}' is '${promoted}' but gradle.properties mod_version is '${declared}'"
            }
        }

        // YaclConfigUiBuilder quotes YACL_COMPILED_VERSION verbatim in its "your YACL is
        // incompatible" error. If that hand-copied literal drifts from the version we actually
        // compile against, the error sends players chasing the wrong jar - which is how the
        // 1.5.0 config-screen bug stayed misdiagnosed as a YACL problem for three releases.
        def pinMatcher = yaclBridge.getText('UTF-8') =~ /YACL_COMPILED_VERSION\s*=\s*"([^"]*)"/
        def pinned = pinMatcher.find() ? pinMatcher.group(1) : '<no YACL_COMPILED_VERSION literal found>'
        if (pinned != project.yacl_version.toString().trim()) {
            mismatches << "YaclConfigUiBuilder.YACL_COMPILED_VERSION is '${pinned}' but gradle.properties yacl_version is '${project.yacl_version}'"
        }
        // The protocol number in the README is what a server owner reads before deciding whether a
        // mixed-version server is safe, so it being wrong is worse than it being absent.
        def protocolMatcher = networkingSource.getText('UTF-8') =~ /PROTOCOL_VERSION\s*=\s*"(\d+)"/
        def actualProtocol = protocolMatcher.find() ? protocolMatcher.group(1) : '<no PROTOCOL_VERSION literal found>'
        def readmeText = readmeFile.getText('UTF-8')
        def documentedProtocols = [] as Set
        def readmeProtocolMatcher = readmeText =~ /PROTOCOL_VERSION\s*=\s*`?(\d+)`?/
        while (readmeProtocolMatcher.find()) documentedProtocols << readmeProtocolMatcher.group(1)
        documentedProtocols.findAll { it != actualProtocol }.each {
            mismatches << "README.md documents PROTOCOL_VERSION=${it} but ServerNetworking says ${actualProtocol}"
        }

        // A download link naming a jar that was never built is the first thing a new player hits.
        [readme: readmeFile, storePage: storePageFile].each { label, docFile ->
            def jarMatcher = docFile.getText('UTF-8') =~ /runicskills-(\d+\.\d+\.\d+)(?:-all)?\.jar/
            def named = [] as Set
            while (jarMatcher.find()) named << jarMatcher.group(1)
            named.findAll { it != declared }.each {
                mismatches << "${docFile.name} names runicskills-${it}.jar but mod_version is '${declared}'"
            }
        }

        // CLAUDE.md is the first file an agent reads, so a stale version there is inherited by
        // every change made from it.
        def guideMatcher = agentGuideFile.getText('UTF-8') =~ /(?m)^-\s*\*\*Version\*\*:\s*`?([\w.\-+]+)`?\s*$/
        if (guideMatcher.find()) {
            if (guideMatcher.group(1) != declared) {
                mismatches << "CLAUDE.md says version '${guideMatcher.group(1)}' but mod_version is '${declared}'"
            }
        } else {
            mismatches << "CLAUDE.md has no '- **Version**: x.y.z' line to check"
        }

        if (!mismatches.isEmpty()) {
            throw new GradleException(
                    "Version drift (a stale VERSION breaks the runtime update checker for all users;\n" +
                            "stale docs send players and server owners to the wrong answer):\n  " +
                            mismatches.join('\n  ') +
                            "\nUpdate VERSION, the CHANGELOG heading, YACL_COMPILED_VERSION, and the\n" +
                            "README / store page / CLAUDE.md references to match before building a release.")
        }
    }
}
tasks.named('check').configure { dependsOn 'checkVersionConsistency' }

// Locale parity. `tooltip.skill.level_up` spent an unknown number of releases carrying the
// three-argument wording from before its call site changed to two, in ALL SIXTEEN non-English
// locales: vanilla catches the resulting TranslatableFormatException and falls back to the raw
// template, so every one of those players saw a literal "%s" in a core tooltip and nothing
// anywhere noticed. Ten keys from perks deleted in 1.5.0 were still shipping too.
//
// Missing keys are NOT an error -- Minecraft falls back to en_us and the translation backlog is
// real content work. They are recorded in intentional_fallbacks.json so the gap is declared
// rather than silent, and so a NEW gap is visible against a known baseline.
tasks.register('checkLangParity') {
    group = 'verification'
    description = 'Fails the build on a stale locale key or a format-placeholder count mismatch against en_us'

    def langDir = file('src/main/resources/assets/runicskills/lang')
    // Outside src/main/resources deliberately: it is a build input, not a game asset, and has no
    // business shipping in the jar.
    def fallbackManifest = file('tools/lang/intentional_fallbacks.json')
    inputs.dir langDir
    inputs.file fallbackManifest

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def english = slurper.parse(new File(langDir, 'en_us.json'), 'UTF-8')

        // Counts %s, %d and %1$s style specifiers; %% is an escaped literal and is not one.
        def placeholderCount = { String value ->
            int count = 0
            def matcher = value =~ /%(?:(\d+)\$)?([A-Za-z%])/
            while (matcher.find()) {
                if (matcher.group(2) != '%') count++
            }
            return count
        }

        def problems = []
        def fallbackCounts = [:]
        langDir.listFiles({ File f -> f.name.endsWith('.json') && f.name != 'en_us.json' } as FileFilter)
                .sort { it.name }
                .each { localeFile ->
            def locale = localeFile.name - '.json'
            def translated = slurper.parse(localeFile, 'UTF-8')

            translated.keySet().findAll { !english.containsKey(it) }.sort().each {
                problems << "${locale}: stale key '${it}' does not exist in en_us -- delete it"
            }
            translated.each { key, value ->
                if (!english.containsKey(key)) return
                int expected = placeholderCount(english[key] as String)
                int actual = placeholderCount(value as String)
                if (expected != actual) {
                    problems << "${locale}: '${key}' has ${actual} format placeholder(s) but en_us has ${expected}" +
                            " -- Minecraft renders the raw template when they disagree"
                }
            }
            fallbackCounts[locale] = english.keySet().findAll { !translated.containsKey(it) }.size()
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Localisation parity:\n  " + problems.join('\n  '))
        }

        // Record, do not fail: the manifest is the declared translation debt.
        def declared = fallbackManifest.exists()
                ? (slurper.parse(fallbackManifest, 'UTF-8').missingKeysPerLocale ?: [:])
                : [:]
        fallbackCounts.each { locale, missing ->
            def baseline = declared[locale]
            if (baseline != null && missing > (baseline as int)) {
                problems << "${locale}: ${missing} keys fall back to en_us, up from the declared ${baseline}" +
                        " -- translate them or raise the baseline in intentional_fallbacks.json deliberately"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Localisation coverage regressed:\n  " + problems.join('\n  '))
        }
    }
}
tasks.named('check').configure { dependsOn 'checkLangParity' }

// CLAUDE.md's mixin list is the single fact in that file most likely to drift, because a mixin is
// added in one place and documented in another. It said "14 total: 4 client, 10 common" while
// runicskills.mixins.json declared 28.
tasks.register('checkMixinInventory') {
    group = 'verification'
    description = "Fails the build if CLAUDE.md's mixin count disagrees with runicskills.mixins.json"

    def mixinConfig = file('src/main/resources/runicskills.mixins.json')
    def agentGuide = file('CLAUDE.md')
    inputs.file mixinConfig
    inputs.file agentGuide

    doLast {
        def parsed = new groovy.json.JsonSlurper().parse(mixinConfig, 'UTF-8')
        int clientCount = (parsed.client ?: []).size()
        int commonCount = (parsed.mixins ?: []).size()
        int total = clientCount + commonCount

        def matcher = agentGuide.getText('UTF-8') =~ /Mixins \((\d+) total: (\d+) client, (\d+) common\)/
        if (!matcher.find()) {
            throw new GradleException(
                    "CLAUDE.md has no 'Mixins (N total: N client, N common)' line to check against " +
                            "runicskills.mixins.json, which declares ${total} (${clientCount} client, ${commonCount} common).")
        }
        if (matcher.group(1) as int != total
                || matcher.group(2) as int != clientCount
                || matcher.group(3) as int != commonCount) {
            throw new GradleException(
                    "CLAUDE.md says ${matcher.group(1)} mixins (${matcher.group(2)} client, ${matcher.group(3)} common) " +
                            "but runicskills.mixins.json declares ${total} (${clientCount} client, ${commonCount} common). " +
                            "Update the Quick Reference and the Mixin Targets section together.")
        }
    }
}
tasks.named('check').configure { dependsOn 'checkMixinInventory' }


// YACL autogen enforcement: YACL's ListGroupImpl rejects any @ListGroup field whose @AutoGen
// declares a non-empty group ("@ListGroup fields cannot be inside a group as lists act as
// groups"), and ConfigClassHandlerImpl rethrows that as
// `YACLAutoGenException: Failed to create option for field '<name>'`. Autogen aborts on the FIRST
// offending field, so one bad annotation makes the whole in-game config screen unopenable on every
// YACL 3.x. That is exactly what happened from 1.5.0 through 1.8.0 (disabledPerks), and it went
// undiagnosed for three releases because the failure reads like a YACL version mismatch. Make it a
// build-time invariant instead.
tasks.register('checkYaclAutogen') {
    group = 'verification'
    description = 'Fails the build if a @ListGroup field also declares @AutoGen(group=...)'

    def javaRoot = file('src/main/java/com/otectus/runicskills')
    inputs.dir javaRoot

    doLast {
        char QUOTE = '"' as char
        char ESCAPE = (char) 92
        char NEWLINE = (char) 10
        char SPACE = ' ' as char
        char AT = '@' as char
        char LPAREN = '(' as char
        char RPAREN = ')' as char

        // Blank out // and /* */ comments while preserving offsets, so annotation-looking text
        // inside a comment can never be mistaken for a real annotation. String literals are copied
        // through verbatim: @SerialEntry(comment = "...") routinely contains quoted parentheses,
        // escaped quotes, and // sequences.
        def stripComments = { String src ->
            def out = new StringBuilder(src.length())
            int i = 0
            int n = src.length()
            while (i < n) {
                char c = src.charAt(i)
                if (c == QUOTE) {
                    int j = i + 1
                    while (j < n) {
                        if (src.charAt(j) == ESCAPE) { j += 2; continue }
                        if (src.charAt(j) == QUOTE) { j++; break }
                        j++
                    }
                    if (j > n) j = n
                    out.append(src, i, j)
                    i = j
                } else if (src.startsWith('//', i)) {
                    int j = src.indexOf(NEWLINE as String, i)
                    if (j < 0) j = n
                    for (int k = i; k < j; k++) out.append(SPACE)
                    i = j
                } else if (src.startsWith('/*', i)) {
                    int j = src.indexOf('*/', i)
                    j = (j < 0) ? n : j + 2
                    for (int k = i; k < j; k++) out.append(src.charAt(k) == NEWLINE ? NEWLINE : SPACE)
                    i = j
                } else {
                    out.append(c)
                    i++
                }
            }
            out.toString()
        }

        // Accumulate annotations until a declaration terminator, then inspect the collected set.
        // A state machine rather than one regex: the config POJOs put several annotations on one
        // line (`@AutoGen(...) @IntField(...)` is common) and spread field declarations over
        // several lines.
        def scanFile = { File f ->
            def hits = []
            String src = stripComments(f.text)
            int i = 0
            int n = src.length()
            def pending = []
            int declStart = 0
            while (i < n) {
                char c = src.charAt(i)
                if (c == AT) {
                    def m = (src.substring(i) =~ /^@(\w+)/)
                    if (!m.find()) { i++; continue }
                    String name = m.group(1)
                    int j = i + m.end()
                    String args = ''
                    int k = j
                    while (k < n && Character.isWhitespace(src.charAt(k))) k++
                    if (k < n && src.charAt(k) == LPAREN) {
                        int depth = 0
                        int start = k
                        while (k < n) {
                            char ch = src.charAt(k)
                            if (ch == QUOTE) {
                                k++
                                while (k < n) {
                                    if (src.charAt(k) == ESCAPE) { k += 2; continue }
                                    if (src.charAt(k) == QUOTE) break
                                    k++
                                }
                            } else if (ch == LPAREN) {
                                depth++
                            } else if (ch == RPAREN) {
                                depth--
                                if (depth == 0) { k++; break }
                            }
                            k++
                        }
                        if (k > n) k = n
                        args = src.substring(Math.min(start + 1, n), Math.max(start + 1, k - 1))
                        j = k
                    }
                    pending << [name: name, args: args, line: src.substring(0, i).count(NEWLINE as String) + 1]
                    i = j
                    declStart = j
                    continue
                }
                if (c == QUOTE) {
                    i++
                    while (i < n) {
                        if (src.charAt(i) == ESCAPE) { i += 2; continue }
                        if (src.charAt(i) == QUOTE) break
                        i++
                    }
                    i++
                    continue
                }
                if (c == (';' as char) || c == ('{' as char) || c == ('}' as char)) {
                    if (!pending.isEmpty()) {
                        def autoGen = pending.find { it.name == 'AutoGen' }
                        def listGroup = pending.find { it.name == 'ListGroup' }
                        if (autoGen != null && listGroup != null) {
                            def gm = (autoGen.args =~ /group\s*=\s*"([^"]*)"/)
                            if (gm.find() && !gm.group(1).trim().isEmpty()) {
                                // Field name: last identifier before the initialiser (or the `;`).
                                String decl = src.substring(Math.min(declStart, i), i)
                                int eq = decl.indexOf('=')
                                if (eq >= 0) decl = decl.substring(0, eq)
                                def names = (decl =~ /(\w+)/).collect { it[1] }
                                String fieldName = names ? names[-1] : '<unknown>'
                                hits << "${f.path}:${autoGen.line}: field '${fieldName}' declares " +
                                        "@AutoGen(group = \"${gm.group(1)}\") together with @ListGroup"
                            }
                        }
                    }
                    pending.clear()
                }
                i++
            }
            hits
        }

        def violations = []
        javaRoot.eachFileRecurse { f ->
            if (f.isFile() && f.name.endsWith('.java')) violations.addAll(scanFile(f))
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Illegal YACL autogen annotations (the in-game config screen will refuse to open):\n  " +
                            violations.join('\n  ') +
                            "\nYACL renders a @ListGroup as its own group, so such a field must use a bare " +
                            "@AutoGen(category = \"...\") with no group=. Drop the group attribute.")
        }
    }
}
tasks.named('check').configure { dependsOn 'checkYaclAutogen' }

// Mixin remapping enforcement: the check that would have caught RS10-041 before it shipped.
//
// `@Mixin(targets = "…", remap = false)` makes EVERY member reference in that class literal — but a
// third-party class that OVERRIDES a vanilla method still ships that method SRG-renamed
// (`releaseUsing` is `m_5551_` inside TConstruct's own jar). Dev and gametests run Mojang-mapped, so a
// literal name resolves there and only there; production throws InvalidInjectionException at class
// load, which for Mixin is fatal for the entire config. Nothing in the toolchain noticed: it compiles
// clean, `runGameTestServer` passes, and the mod is broken for every player.
//
// So this task resolves every member a mixin references against the REAL class hierarchy in the deobf
// artifacts, decides whether that member is vanilla-declared by looking at where it is declared rather
// than at what it is called, and then demands the naming discipline that follows from the answer:
//   * declared under net/minecraft/ (directly or by any ancestor) -> obfuscated at runtime -> the
//     reference must be remapped and the annotation processor must have emitted an SRG refmap entry
//     for it, OR the selector must carry the SRG name literally alongside the MCP one;
//   * declared anywhere else -> NOT obfuscated -> the reference must NOT be remapped. This mirror rule
//     is the silent half: remapping a Tinkers'-declared `@At` target does not crash, it just quietly
//     stops matching, and the hook disappears with no log line at all.
//
// What it CANNOT catch, and what therefore still needs a real launch:
//   * LVT drift — `@Local` / `@ModifyVariable` ordinals shifting under another mod's transform.
//   * Reflection-based hooks; nothing here reads a `Class.forName` string.
//   * Mixins whose target jar is off the compile classpath (reported UNRESOLVED, downgraded to a
//     warning for `@Pseudo` mixins, where absence is the declared intent).
//   * Renames in Tinkers' 3.12 — the beta profile is conservative by design and is not compiled here.
tasks.register('checkMixinRemapping') {
    group = 'verification'
    description = 'Fails the build if a mixin member reference is remapped wrongly for production'

    dependsOn 'createSrgToMcp', 'compileJava'

    def mixinRoot = file('src/main/java/com/otectus/runicskills/mixin')
    def srgFile = file('build/createSrgToMcp/output.srg')
    def refmapPrimary = file('build/tmp/compileJava/compileJava-refmap.json')
    def refmapFallback = file('build/tmp/compileJava/runicskills.refmap.json')
    // The deobf Tinkers'/Mantle artifacts: MCP-named, so right for resolving the hierarchy and
    // useless for SRG names, which output.srg supplies. Declared lazily so the configuration is not
    // resolved at configuration time.
    def targetArtifacts = { configurations.compileClasspath.files.findAll { it.name ==~ /(?i)^(TConstruct|Mantle)-.*\.jar$/ } }

    // Configuration-time inputs so the task is up-to-date aware.
    inputs.dir mixinRoot
    inputs.file srgFile
    inputs.files targetArtifacts

    doLast {
        // ---- the injector annotations this check understands -------------------------------------
        // Plain Mixin plus the MixinExtras set actually reachable from the annotationProcessor path.
        def injectorNames = ['Inject', 'Redirect', 'ModifyArgs', 'ModifyArg', 'ModifyVariable',
                             'ModifyConstant', 'WrapMethod', 'WrapOperation', 'ModifyExpressionValue',
                             'ModifyReturnValue', 'WrapWithCondition']
        def injectorPattern = ~('@(' + injectorNames.join('|') + ')\\b')

        // ---- source utilities --------------------------------------------------------------------
        // Blank comments in place (spaces for everything but newlines) so annotation text can be read
        // as whole-file text — these annotations span lines — without moving a single line number.
        def blankComments = { String src ->
            def out = new StringBuilder(src)
            int i = 0, n = src.length()
            while (i < n) {
                char c = src.charAt(i)
                if (c == ('"' as char) || c == ("'" as char)) {
                    char q = c; i++
                    while (i < n) {
                        char d = src.charAt(i)
                        if (d == ('\\' as char)) { i += 2; continue }
                        i++
                        if (d == q) break
                    }
                } else if (c == ('/' as char) && i + 1 < n && src.charAt(i + 1) == ('/' as char)) {
                    while (i < n && src.charAt(i) != ('\n' as char)) { out.setCharAt(i, ' ' as char); i++ }
                } else if (c == ('/' as char) && i + 1 < n && src.charAt(i + 1) == ('*' as char)) {
                    int end = src.indexOf('*/', i + 2)
                    if (end < 0) end = n - 2
                    for (int k = i; k < Math.min(end + 2, n); k++) {
                        if (src.charAt(k) != ('\n' as char)) out.setCharAt(k, ' ' as char)
                    }
                    i = end + 2
                } else {
                    i++
                }
            }
            out.toString()
        }
        // Index of the ')' matching the '(' at `open`, ignoring parens inside literals.
        def matchParen = { String src, int open ->
            int depth = 0, i = open, n = src.length()
            while (i < n) {
                char c = src.charAt(i)
                if (c == ('"' as char) || c == ("'" as char)) {
                    char q = c; i++
                    while (i < n) {
                        char d = src.charAt(i)
                        if (d == ('\\' as char)) { i += 2; continue }
                        i++
                        if (d == q) break
                    }
                    continue
                }
                if (c == ('(' as char)) depth++
                if (c == (')' as char)) { depth--; if (depth == 0) return i }
                i++
            }
            return -1
        }
        def lineOf = { String src, int idx -> src.substring(0, idx).count('\n') + 1 }
        // Concatenate every string literal in an expression: annotation values are literals and '+'
        // only, so this is exactly Java's constant folding for the forms that can appear here.
        def literalsOf = { String expr ->
            def sb = new StringBuilder()
            def m = (expr =~ /"((?:[^"\\]|\\.)*)"/)
            while (m.find()) sb.append(m.group(1))
            return sb.toString()
        }
        // Split an annotation array body at top-level commas.
        def splitTop
        splitTop = { String body ->
            def parts = []; def cur = new StringBuilder()
            int depth = 0, i = 0, n = body.length()
            while (i < n) {
                char c = body.charAt(i)
                if (c == ('"' as char) || c == ("'" as char)) {
                    char q = c; cur.append(c); i++
                    while (i < n) {
                        char d = body.charAt(i); cur.append(d)
                        if (d == ('\\' as char)) { if (i + 1 < n) cur.append(body.charAt(i + 1)); i += 2; continue }
                        i++
                        if (d == q) break
                    }
                    continue
                }
                if (c == ('(' as char) || c == ('{' as char)) depth++
                if (c == (')' as char) || c == ('}' as char)) depth--
                if (c == (',' as char) && depth == 0) { parts << cur.toString(); cur = new StringBuilder(); i++; continue }
                cur.append(c); i++
            }
            if (cur.toString().trim()) parts << cur.toString()
            return parts
        }
        // Read `name = <expr>` out of an annotation body, top level only.
        def attrOf = { String body, String name ->
            def m = (body =~ ('(?s)(?:^|[,(\\s])' + name + '\\s*=\\s*'))
            if (!m.find()) return null
            int start = m.end()
            def rest = body.substring(start)
            if (rest.trim().startsWith('{')) {
                int open = rest.indexOf('{')
                int depth = 0, i = open
                while (i < rest.length()) {
                    char c = rest.charAt(i)
                    if (c == ('{' as char)) depth++
                    if (c == ('}' as char)) { depth--; if (depth == 0) break }
                    i++
                }
                return rest.substring(open, Math.min(i + 1, rest.length()))
            }
            return splitTop(rest)[0]
        }
        // A `method =` / `target =` value as a list of selector strings, resolving the
        // `private static final String X = "…"` constants this package uses for repeated selectors.
        def selectorsOf = { String expr, Map consts ->
            if (expr == null) return null
            def body = expr.trim()
            if (body.startsWith('{')) body = body.substring(1, body.length() - 1)
            def out = []
            splitTop(body).each { part ->
                def lit = literalsOf(part)
                if (lit) { out << lit; return }
                def ident = part.trim()
                if (consts.containsKey(ident)) { out << consts[ident]; return }
                out << null  // unparseable — reported, never silently dropped
            }
            return out
        }

        // ---- SRG table ----------------------------------------------------------------------------
        // output.srg is SRG->MCP; invert the obfuscated half of it so a resolved (owner, name, desc)
        // answers "does this member have an SRG name at runtime, and which one".
        def srgMethods = [:]
        def srgFields = [:]
        srgFile.eachLine { line ->
            if (line.startsWith('MD: ')) {
                def p = line.split(' ')
                if (p.length != 5) return
                def srgName = p[1].substring(p[1].lastIndexOf('/') + 1)
                if (srgName ==~ /m_\d+_/) srgMethods[p[3] + ' ' + p[4]] = srgName
            } else if (line.startsWith('FD: ')) {
                def p = line.split(' ')
                if (p.length != 3) return
                def srgName = p[1].substring(p[1].lastIndexOf('/') + 1)
                if (srgName ==~ /f_\d+_/) srgFields[p[2]] = srgName
            }
        }

        // ---- refmap -------------------------------------------------------------------------------
        def refmapFile = refmapPrimary.exists() ? refmapPrimary : refmapFallback
        if (!refmapFile.exists()) {
            throw new GradleException(
                    "No annotation-processor refmap at ${refmapPrimary} or ${refmapFallback}.\n" +
                            "Run compileJava first; without a refmap nothing can be verified.")
        }
        def refMappings = new groovy.json.JsonSlurper().parseText(refmapFile.text).mappings ?: [:]

        // ---- class pool ---------------------------------------------------------------------------
        def jars = []
        configurations.compileClasspath.files.each { f ->
            if (f.isFile() && f.name.endsWith('.jar')) {
                try { jars << new java.util.jar.JarFile(f) } catch (ignored) { }
            }
        }
        def classCache = [:]
        def readClass = { String internal ->
            if (classCache.containsKey(internal)) return classCache[internal]
            def node = null
            for (jar in jars) {
                def entry = jar.getEntry(internal + '.class')
                if (entry == null) continue
                def bytes = jar.getInputStream(entry).bytes
                node = new org.objectweb.asm.tree.ClassNode()
                new org.objectweb.asm.ClassReader(bytes).accept(node,
                        org.objectweb.asm.ClassReader.SKIP_CODE |
                                org.objectweb.asm.ClassReader.SKIP_DEBUG |
                                org.objectweb.asm.ClassReader.SKIP_FRAMES)
                break
            }
            classCache[internal] = node
            return node
        }
        // Every class in the hierarchy that DECLARES this member. A Tinkers' class overriding a
        // vanilla method declares it too, and is still SRG-renamed because vanilla declared it first —
        // so the vanilla ancestor, when one exists, is the answer that decides obfuscation.
        def declarersOf = { String owner, String name, String desc, boolean isField ->
            def found = []
            def seen = new HashSet()
            def queue = [owner]
            boolean missingRoot = false
            while (!queue.isEmpty()) {
                def cur = queue.remove(0)
                if (cur == null || !seen.add(cur)) continue
                def node = readClass(cur)
                if (node == null) { if (cur == owner) missingRoot = true; continue }
                def members = isField ? node.fields : node.methods
                if (members.any { it.name == name && (desc == null || it.desc == desc) }) found << cur
                if (node.superName) queue << node.superName
                if (node.interfaces) queue.addAll(node.interfaces)
            }
            return [declarers: found, missingRoot: missingRoot]
        }

        // ---- parse the mixin sources ---------------------------------------------------------------
        def refs = []                 // every member reference, ready for a verdict
        def parseViolations = []
        def requireViolations = []
        int parsedCount = 0

        mixinRoot.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith('.java')) return
            def src = blankComments(f.text)
            def rel = f.path
            def isTconstruct = f.canonicalPath.contains(File.separator + 'mixin' + File.separator + 'tconstruct' + File.separator)
            def pseudo = src.contains('@Pseudo')

            // Imports, so `X.class` in @Mixin can be turned into an internal name.
            def imports = [:]
            (src =~ /(?m)^\s*import\s+(?:static\s+)?([\w.]+)\s*;/).each { m ->
                def fq = m[1]
                imports[fq.substring(fq.lastIndexOf('.') + 1)] = fq.replace('.', '/')
            }
            // Second half of the completeness assertion, and the half that survives a new annotation
            // type appearing: counting occurrences of a known name cannot notice a name nobody added
            // to the list. An injector import whose simple name this check does not model is
            // therefore itself a violation.
            def knownNonInjectors = ['At', 'Slice', 'Constant', 'Desc', 'Coerce', 'Operation', 'Group']
            (src =~ /(?m)^\s*import\s+(?:org\.spongepowered\.asm\.mixin\.injection|com\.llamalad7\.mixinextras\.injector[\w.]*)\.(\w+)\s*;/).each { m ->
                if (!injectorNames.contains(m[1]) && !knownNonInjectors.contains(m[1])) {
                    parseViolations << "${f.path}: imports injector annotation @${m[1]}, which checkMixinRemapping does not model — add it to injectorNames"
                }
            }

            // `String X = "…"` selector constants.
            def consts = [:]
            (src =~ /(?s)String\s+(\w+)\s*=\s*((?:"(?:[^"\\]|\\.)*"\s*\+?\s*)+);/).each { m ->
                consts[m[1]] = literalsOf(m[2])
            }

            // @Mixin: targets and class-level remap.
            int mixinIdx = src.indexOf('@Mixin(')
            if (mixinIdx < 0) return   // the mixin plugin itself, and any helper with no @Mixin
            int mixinOpen = src.indexOf('(', mixinIdx)
            int mixinEnd = matchParen(src, mixinOpen)
            def mixinBody = src.substring(mixinOpen + 1, mixinEnd)
            boolean classRemap = true
            def cr = attrOf(mixinBody, 'remap')
            if (cr != null) classRemap = cr.trim() == 'true'

            def targets = []
            def targetExpr = attrOf(mixinBody, 'targets')
            if (targetExpr != null) {
                selectorsOf(targetExpr, consts).each { if (it) targets << it.replace('.', '/') }
            }
            def valueExpr = attrOf(mixinBody, 'value')
            if (valueExpr == null && targetExpr == null) valueExpr = mixinBody
            if (valueExpr != null) {
                def body = valueExpr.trim()
                if (body.startsWith('{')) body = body.substring(1, body.length() - 1)
                splitTop(body).each { part ->
                    def t = part.trim()
                    if (!t.endsWith('.class')) return
                    def segs = t.substring(0, t.length() - 6).tokenize('.')
                    def root = imports[segs[0]]
                    if (root == null) return
                    targets << ([root] + segs.drop(1)).join('$')
                }
            }
            def mixinClass = 'com/otectus/runicskills/mixin/' +
                    (f.canonicalPath - mixinRoot.canonicalPath - File.separator - '.java').replace(File.separator, '/')

            // Completeness assertion: count the annotations, then require the parser to have produced
            // an entry for each. A regex that misses one would otherwise be a silent pass forever.
            int counted = 0
            def cm = (src =~ injectorPattern)
            while (cm.find()) counted++

            int seenHere = 0
            def am = (src =~ injectorPattern)
            while (am.find()) {
                int at = am.start()
                int open = src.indexOf('(', am.end())
                def line = lineOf(src, at)
                def annName = am.group()
                if (open < 0 || src.substring(am.end(), open).trim()) {
                    parseViolations << "${rel}:${line}: ${annName} has no parseable argument list"
                    continue
                }
                int close = matchParen(src, open)
                if (close < 0) {
                    parseViolations << "${rel}:${line}: ${annName} has an unbalanced argument list"
                    continue
                }
                seenHere++
                def body = src.substring(open + 1, close)

                // Pull nested @At blocks out before reading the injector's own remap, so an @At's
                // remap is never mistaken for the injector's.
                def ats = []
                def strippedBody = new StringBuilder(body)
                def atm = (body =~ /@At\s*\(/)
                while (atm.find()) {
                    int aopen = body.indexOf('(', atm.start())
                    int aclose = matchParen(body, aopen)
                    if (aclose < 0) continue
                    ats << body.substring(aopen + 1, aclose)
                    for (int k = atm.start(); k <= aclose; k++) strippedBody.setCharAt(k, ' ' as char)
                }
                body = strippedBody.toString()

                boolean injRemap = classRemap
                def ir = attrOf(body, 'remap')
                if (ir != null) injRemap = ir.trim() == 'true'

                if (isTconstruct) {
                    def req = attrOf(body, 'require')
                    def exp = attrOf(body, 'expect')
                    if (req == null || req.trim() != '0' || exp == null || exp.trim() != '1') {
                        requireViolations << "${rel}:${line}: ${annName} — require=${req?.trim()} expect=${exp?.trim()}"
                    }
                }

                def sels = selectorsOf(attrOf(body, 'method'), consts)
                if (sels == null) {
                    parseViolations << "${rel}:${line}: ${annName} has no method= selector the parser could read"
                } else if (sels.any { it == null }) {
                    parseViolations << "${rel}:${line}: ${annName} method= contains a non-literal the parser could not resolve"
                } else {
                    refs << [file: rel, line: line, mixin: mixinClass, ann: annName, targets: targets,
                             selectors: sels, remap: injRemap, pseudo: pseudo]
                }

                ats.each { atBody ->
                    boolean atRemap = injRemap
                    def ar = attrOf(atBody, 'remap')
                    if (ar != null) atRemap = ar.trim() == 'true'
                    def tsel = selectorsOf(attrOf(atBody, 'target'), consts)
                    if (tsel == null) return   // @At("HEAD"/"RETURN"/…) carries no target
                    if (tsel.any { it == null }) {
                        parseViolations << "${rel}:${line}: ${annName} @At target= contains a non-literal the parser could not resolve"
                        return
                    }
                    refs << [file: rel, line: line, mixin: mixinClass, ann: annName + ' @At', targets: targets,
                             selectors: tsel, remap: atRemap, pseudo: pseudo]
                }
            }
            if (seenHere < counted) {
                parseViolations << "${rel}: parser extracted ${seenHere} of ${counted} injector annotations"
            }
            parsedCount += seenHere
        }

        // ---- verdicts ---------------------------------------------------------------------------
        def violations = []
        def warnings = []
        refs.each { ref ->
            def entries = refMappings[ref.mixin] ?: [:]
            ref.selectors.each { sel ->
                if (sel.contains('*')) return   // wildcard selector: nothing to resolve
                // The production half of a dual-name selector (Step 7's escape hatch): an SRG name
                // never resolves against the MCP-named deobf artifacts, and does not need to — its
                // MCP sibling is checked on its own, and that verdict is what asserts the two agree.
                // Alone, though, an SRG name would break runClient and runGameTestServer outright.
                if (sel.replaceAll(/^L[^;]+;/, '').replaceAll(/[(:].*$/, '') ==~ /(m_|f_)\d+_/) {
                    if (ref.selectors.size() < 2) {
                        violations << ("${ref.file}:${ref.line}: ${ref.ann} '${sel}' — a bare SRG name resolves in "
                                + "production and nowhere else. Pair it with the MCP name in the same selector array.")
                    }
                    return
                }
                // `Lowner;name(desc)ret` | `Lowner;name:Ltype;` | `name(desc)ret` | `name`
                def owners = ref.targets
                def rest = sel
                if (sel.startsWith('L') && sel.contains(';')) {
                    owners = [sel.substring(1, sel.indexOf(';'))]
                    rest = sel.substring(sel.indexOf(';') + 1)
                }
                if (!rest) return               // `Lowner;` alone (NEW / instanceof)
                def name, desc
                boolean isField = false
                if (rest.contains('(')) {
                    name = rest.substring(0, rest.indexOf('('))
                    desc = rest.substring(rest.indexOf('('))
                } else if (rest.contains(':')) {
                    isField = true
                    name = rest.substring(0, rest.indexOf(':'))
                    desc = rest.substring(rest.indexOf(':') + 1)
                } else {
                    name = rest; desc = null
                }
                if (owners.isEmpty()) {
                    violations << "${ref.file}:${ref.line}: ${ref.ann} '${sel}' — the @Mixin target could not be read"
                    return
                }

                def declarers = []
                boolean missingRoot = false
                boolean anyFound = false
                owners.each { o ->
                    def r = declarersOf(o, name, desc, isField)
                    if (r.missingRoot) missingRoot = true
                    if (!r.declarers.isEmpty()) anyFound = true
                    declarers.addAll(r.declarers)
                }
                if (missingRoot && !anyFound) {
                    // UNRESOLVED. For a @Mixin target this is a defect: the mixin cannot be verified
                    // and, @Pseudo aside, cannot apply either. For an @At owner it is the blind spot
                    // named in the header — an optional third-party class (Botania's ManaItemHandler)
                    // that this build deliberately does not put on the compile classpath, whose
                    // obfuscation status therefore cannot be decided here.
                    def msg = "${ref.file}:${ref.line}: ${ref.ann} '${sel}' — ${owners.join(', ')} is not on the compile classpath (UNRESOLVED)"
                    if (ref.pseudo || ref.ann.endsWith('@At')) warnings << msg else violations << msg
                    return
                }
                if (declarers.isEmpty()) {
                    violations << "${ref.file}:${ref.line}: ${ref.ann} '${sel}' — no such member on ${owners.join(', ')} or any ancestor"
                    return
                }
                def vanilla = declarers.find { it.startsWith('net/minecraft/') }
                def declaring = vanilla ?: declarers[0]

                if (vanilla != null) {
                    def srg = isField ? srgFields[vanilla + '/' + name]
                            : srgMethods[vanilla + '/' + name + ' ' + (desc ?: '')]
                    if (srg == null && desc == null && !isField) {
                        // No descriptor in the selector: find the SRG name by owner and name alone.
                        srg = srgMethods.find { k, v -> k.startsWith(vanilla + '/' + name + ' ') }?.value
                    }
                    if (srg == null) return     // vanilla but not obfuscated (<init>, Forge additions)
                    if (ref.remap) {
                        def mapped = entries[sel]
                        def nm = mapped == null ? null : (mapped =~ /;([^;(:]+)/)
                        def mappedName = (nm != null && nm.find()) ? nm.group(1) : null
                        if (mappedName == null || !(mappedName ==~ /(m_|f_)\d+_/)) {
                            violations << "${ref.file}:${ref.line}: ${ref.mixin} ${ref.ann} '${sel}'\n" +
                                    "      declared by ${declaring}, obfuscated at runtime as ${srg}, but the refmap holds\n" +
                                    "      no SRG entry for it — production will look for '${name}' and not find it.\n" +
                                    "      Fix: qualify the selector with its full descriptor so the AP can resolve it, or use\n" +
                                    "      the dual-name form method = {\"${name}${desc ?: ''}\", \"${srg}${desc ?: ''}\"} with remap = false."
                        }
                    } else if (!ref.selectors.any { it?.contains(srg) }) {
                        violations << "${ref.file}:${ref.line}: ${ref.mixin} ${ref.ann} '${sel}'\n" +
                                "      declared by ${declaring}, obfuscated at runtime as ${srg}, but remap = false and the\n" +
                                "      selector carries no SRG name — this resolves in dev and throws in production.\n" +
                                "      Fix: set remap = true on this annotation, or add \"${srg}${desc ?: ''}\" to the selector."
                    }
                } else if (ref.remap) {
                    violations << "${ref.file}:${ref.line}: ${ref.mixin} ${ref.ann} '${sel}'\n" +
                            "      declared by ${declaring}, which is not obfuscated, yet remap = true. Mixin rewrites this\n" +
                            "      name in production and then silently stops matching — no crash, the hook just vanishes.\n" +
                            "      Fix: remap = false here (an @At inherits its injector's remap, so state it explicitly)."
                }
            }
        }

        jars.each { try { it.close() } catch (ignored) { } }

        warnings.each { logger.lifecycle("checkMixinRemapping WARNING: ${it}") }
        if (!parseViolations.isEmpty()) {
            throw new GradleException(
                    "checkMixinRemapping could not parse every injector annotation. A reference it cannot read is\n" +
                            "a reference it cannot check, which is exactly the silent pass this task exists to prevent:\n  " +
                            parseViolations.join('\n  '))
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Mixin remapping violations (these compile clean, pass gametests, and fail in production):\n  " +
                            violations.join('\n  '))
        }
        if (!requireViolations.isEmpty()) {
            throw new GradleException(
                    "Tinkers' mixins must declare require = 0, expect = 1: no hook under mixin/tconstruct/ is\n" +
                            "load-bearing, and a failed apply there must warn loudly rather than kill the whole mixin\n" +
                            "config in a 300-mod pack:\n  " +
                            requireViolations.join('\n  '))
        }
        logger.lifecycle("checkMixinRemapping: ${parsedCount} injectors, ${refs.size()} member references verified")
    }
}
tasks.named('check').configure { dependsOn 'checkMixinRemapping' }

// Shipped-artifact verification. `checkMixinRemapping` proves the build directory is right; this
// proves the same of the file players actually install, which is not the same claim. The refmap is
// generated by an annotation processor into build/tmp, copied by processResources, and packaged by
// jar — three steps that have each been wrong at least once, and none of which fail loudly. A refmap
// that is correct in build/tmp and missing from the jar produces exactly the RS10-041 crash.
//
// It also asserts the jar's entry set, and it inspects the jarJar bundle rather than the slim jar
// because that is what a player installs. This assertion used to run the other way round — it
// treated any META-INF/jarjar/ as unexpected, on the assumption that Forge supplies MixinExtras.
// Forge 1.20.1 47.x does not (checked against the 47.4.22 runtime's libraries and jars), so the shipped artifact carrying
// mixinextras-forge is now the requirement, not the anomaly (RS10-042). It also checks that the
// file it just vetted is the one README tells players to download, because a build that ships a
// good jar under a name nobody is pointed at fixes nothing.
tasks.register('verifyShippedRefmap') {
    group = 'verification'
    description = 'Fails the build if the shipped jar lacks the SRG refmap entries or the bundled MixinExtras production needs'

    dependsOn 'jarJar'

    def jarProvider = tasks.named('jarJar').flatMap { it.archiveFile }
    def slimProvider = tasks.named('jar').flatMap { it.archiveFile }
    def apRefmap = file('build/tmp/compileJava/compileJava-refmap.json')
    def mixinRoot = file('src/main/java/com/otectus/runicskills/mixin')
    def readmeFile = file('README.md')

    inputs.file jarProvider
    inputs.dir mixinRoot
    inputs.file readmeFile

    doLast {
        def jarFile = jarProvider.get().asFile
        def problems = []
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def names = zip.entries().collect { it.name } as Set

            // The entries the mod cannot load without.
            ['runicskills.refmap.json', 'runicskills.mixins.json', 'META-INF/mods.toml'].each {
                if (!names.contains(it)) problems << "missing entry ${it}"
            }
            // MixinExtras must travel with the mod: Forge does not provide it, and without it every
            // @ModifyReturnValue injector in this jar has no implementation on a minimal install.
            if (!names.any { it ==~ /META-INF\/jarjar\/mixinextras-forge-.*\.jar/ }) {
                problems << "no META-INF/jarjar/mixinextras-forge-*.jar — Forge does not supply MixinExtras, " +
                        "so the @ModifyReturnValue injectors would only work on packs where another mod bundles it"
            }

            // The name a player is told to download must be the name of the file just vetted.
            def readmeText = readmeFile.getText('UTF-8')
            if (!readmeText.contains(jarFile.name)) {
                problems << "README.md does not name ${jarFile.name}, the artifact this task verified — " +
                        "point the download instruction at it or players get an unverified file"
            }
            def slimName = slimProvider.get().asFile.name
            if (readmeText.contains(slimName)) {
                problems << "README.md names ${slimName}, which is the slim artifact and carries no MixinExtras"
            }

            if (names.contains('runicskills.refmap.json')) {
                def shipped = new groovy.json.JsonSlurper().parseText(
                        zip.getInputStream(zip.getEntry('runicskills.refmap.json')).text)
                def shippedMappings = shipped.mappings ?: [:]

                // 1. Everything the annotation processor produced must have survived to the jar.
                if (apRefmap.exists()) {
                    def built = new groovy.json.JsonSlurper().parseText(apRefmap.text).mappings ?: [:]
                    built.each { cls, entries ->
                        def got = shippedMappings[cls]
                        if (got == null) {
                            problems << "refmap class ${cls} was generated but is not in the jar"
                            return
                        }
                        entries.each { k, v ->
                            if (got[k] != v) {
                                problems << "refmap ${cls} '${k}': jar has ${got[k]}, build produced ${v}"
                            }
                        }
                    }
                }

                // 2. Every Tinkers' mixin with refmap entries must have SRG ones. A mixin in that
                // package only earns an entry by referencing a vanilla-declared member, and a
                // vanilla-declared member is SRG-renamed inside TConstruct's own production jar —
                // so an MCP name surviving here is the exact defect that broke the pack.
                def tconstructMixins = []
                new File(mixinRoot, 'tconstruct').eachFileRecurse { f ->
                    if (f.isFile() && f.name.endsWith('.java')) {
                        tconstructMixins << (f.canonicalPath - mixinRoot.canonicalPath - File.separator - '.java')
                                .replace(File.separator, '/')
                    }
                }
                def checked = 0
                shippedMappings.each { cls, entries ->
                    def simple = cls - 'com/otectus/runicskills/mixin/'
                    if (!tconstructMixins.contains(simple)) return
                    entries.each { k, v ->
                        def member = (v =~ /;([^;(:]+)/)
                        def name = member.find() ? member.group(1) : null
                        if (name == null || !(name ==~ /(m_|f_)\d+_/)) {
                            problems << "refmap ${cls} '${k}' maps to ${v}, which carries no SRG name — " +
                                    "production will look for the MCP name and Mixin will fail the whole config"
                        } else {
                            checked++
                        }
                    }
                }
                logger.lifecycle("verifyShippedRefmap: ${jarFile.name}, ${shippedMappings.size()} refmap classes, " +
                        "${checked} Tinkers' SRG entries")
            }
        } finally {
            zip.close()
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                    "Shipped artifact is not production-safe (${jarFile}):\n  " + problems.join('\n  '))
        }
    }
}
tasks.named('build').configure { dependsOn 'verifyShippedRefmap' }
